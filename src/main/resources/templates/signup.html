<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>회원가입</title>
    <style>
        /* 기존 스타일 유지 */
    </style>
</head>
<body>
<h2>회원가입</h2>
<form th:action="@{/users/signup}" th:object="${userJoinDto}" method="post">
    <div th:if="${error}" th:text="${error}" style="color: red;"></div>
    <div>
        <label for="name">이름:</label>
        <input type="text" id="name" th:field="*{userName}" required>
    </div>
    <div>
        <label for="region">지역:</label>
        <select id="region" th:field="*{userRegionId}" required>
            <option value="" disabled selected>지역을 선택하세요</option>
            <option value="1">수원시</option>
            <option value="2">서울시</option>
            <option value="3">안양시</option>
            <!-- 다른 지역 추가 -->
        </select>
    </div>

    <div>
        <label for="email">이메일:</label>
        <input type="email" id="email" th:field="*{email}" required>
    </div>
    <div>
        <label for="password">비밀번호:</label>
        <input type="password" id="password" th:field="*{password}" required>
    </div>
    <div>
        <label for="gender">성별:</label>
        <select id="gender" th:field="*{gender}">
            <option value="1">남성</option>
            <option value="2">여성</option>
        </select>
    </div>
    <div>
        <label for="address">주소:</label>
        <input type="text" id="address" th:field="*{address}" required>
    </div>
    <div>
        <label>선호 카테고리:</label>
        <div class="userFavFoodIdList">
            <label><input type="checkbox" name="userFavFoodIdList" value="1"> 한식</label>
            <label><input type="checkbox" name="userFavFoodIdList" value="2"> 일식</label>
            <label><input type="checkbox" name="userFavFoodIdList" value="3"> 중식</label>
            <label><input type="checkbox" name="userFavFoodIdList" value="4"> 양식</label>
            <label><input type="checkbox" name="userFavFoodIdList" value="5"> 치킨</label>
            <label><input type="checkbox" name="userFavFoodIdList" value="6"> 분식</label>
            <label><input type="checkbox" name="userFavFoodIdList" value="7"> 고기/구이</label>
            <label><input type="checkbox" name="userFavFoodIdList" value="8"> 도시락</label>
            <label><input type="checkbox" name="userFavFoodIdList" value="9"> 야식 (족발,보쌈)</label>
            <label><input type="checkbox" name="userFavFoodIdList" value="10"> 패스트푸드</label>
            <label><input type="checkbox" name="userFavFoodIdList" value="11"> 디저트</label>
            <label><input type="checkbox" name="userFavFoodIdList" value="12"> 아시안푸드</label>
        </div>
    </div>
    <div>
        <label for="role">역할:</label>
        <select id="role" th:field="*{role}">
            <option value="USER">일반 사용자</option>
            <option value="ADMIN">관리자</option>
        </select>
    </div>
    <button type="submit">가입하기</button>
</form>
</body>
</html>
